# Tests for plugins/verified-memory, plugins/verified-memory-mcp and its browser pack maker (web/).
name: verified-memory tests

on:
  pull_request:
    paths: ['plugins/verified-memory/**', 'plugins/verified-memory-mcp/**', '.github/workflows/verified-memory-tests.yml']
  push:
    branches: [master]
    paths: ['plugins/verified-memory/**', 'plugins/verified-memory-mcp/**', '.github/workflows/verified-memory-tests.yml']

permissions:
  contents: read

jobs:
  no-private-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Signed packs: private keys never go in the repo. The one excluded file is a masking
      # test whose input is a fake key header with the body "AAAA".
      - name: No private key material in the repository
        run: "! git grep -I -n -E 'BEGIN ([A-Z]+ )?PRIVATE KEY' -- . ':(exclude)agent-memory/tests/test_export_and_masking.py'"

  openclaw-plugin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: plugins/verified-memory } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: npm, cache-dependency-path: plugins/verified-memory/package-lock.json }
      - run: npm ci
      - run: npm test

  mcp-and-pack-maker:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: ['22', '24'] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            plugins/verified-memory-mcp/package-lock.json
            plugins/verified-memory-mcp/web/package-lock.json
      - run: npm ci && npm test
        working-directory: plugins/verified-memory-mcp
      - run: npm ci && npm test
        working-directory: plugins/verified-memory-mcp/web

  # Builds the Claude Desktop bundle (.mcpb) and runs it with the argument substitution
  # Claude Desktop uses. Not a release: the file is kept as a short-lived workflow artifact.
  mcpb-bundle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest], node: ['22', '24'] }
    defaults: { run: { working-directory: plugins/verified-memory-mcp } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ matrix.node }}', cache: npm, cache-dependency-path: plugins/verified-memory-mcp/package-lock.json }
      - run: npm ci
      - run: npm run test:mcpb
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: verified-memory-mcpb, path: plugins/verified-memory-mcp/build/*.mcpb, retention-days: 7, if-no-files-found: error }

  pack-maker-browsers:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: plugins/verified-memory-mcp/web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            plugins/verified-memory-mcp/package-lock.json
            plugins/verified-memory-mcp/web/package-lock.json
      - run: npm ci --prefix .. && npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env: { CI: 'true' }
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: playwright-results, path: plugins/verified-memory-mcp/web/test-results, retention-days: 7 }
